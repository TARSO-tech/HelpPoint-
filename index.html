<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpPoint v2.1 — Find Local Experts</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --medical: #ef4444;
      --medical-soft: #fef2f2;
      --medical-glow: rgba(239,68,68,0.15);
      --tech: #0ea5e9;
      --tech-soft: #f0f9ff;
      --tech-glow: rgba(14,165,233,0.15);
      --machine: #f59e0b;
      --machine-soft: #fffbeb;
      --machine-glow: rgba(245,158,11,0.15);
      --carpentry: #8b5cf6;
      --carpentry-soft: #f5f3ff;
      --carpentry-glow: rgba(139,92,246,0.15);
      --education: #10b981;
      --education-soft: #ecfdf5;
      --education-glow: rgba(16,185,129,0.15);
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-elevated: rgba(255,255,255,0.85);
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
      --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.05), 0 2px 4px -2px rgba(15,23,42,0.04);
      --shadow-lg: 0 10px 15px -3px rgba(15,23,42,0.06), 0 4px 6px -4px rgba(15,23,42,0.04);
      --shadow-xl: 0 20px 25px -5px rgba(15,23,42,0.08), 0 8px 10px -6px rgba(15,23,42,0.04);
      --shadow-glow: 0 0 40px rgba(99,102,241,0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, var(--primary-dark) 100%);
      color: white;
      padding: 2.5rem 1.5rem 4rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header-glow {
      position: absolute;
      top: -50%;
      left: -20%;
      width: 140%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.4) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.25) 0%, transparent 40%);
      pointer-events: none;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .logo-text {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.15);
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.5rem;
      background: rgba(255,255,255,0.15);
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .subtitle {
      position: relative;
      z-index: 1;
      margin: 0.5rem 0 0;
      opacity: 0.65;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* Main */
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 1.25rem 2rem;
      position: relative;
      top: -2.5rem;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
      animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      margin-bottom: 1.25rem;
    }

    .section-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      background: rgba(99,102,241,0.08);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .section-header h2 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    /* Category Cards */
    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .category-card {
      position: relative;
      background: var(--surface);
      border: 1.5px solid transparent;
      border-radius: 1.25rem;
      padding: 0;
      text-align: left;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      outline: none;
    }

    .category-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 1.25rem;
      padding: 1.5px;
      background: linear-gradient(135deg, transparent, transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .category-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: var(--shadow-xl);
    }

    .category-card:hover .card-arrow {
      transform: translateX(3px);
      opacity: 1;
    }

    .category-card:hover .card-shine {
      opacity: 1;
      transform: translateX(100%) rotate(25deg);
    }

    .category-card:active {
      transform: scale(0.97);
      transition-duration: 0.1s;
    }

    .category-card:focus-visible {
      box-shadow: 0 0 0 3px rgba(99,102,241,0.25), var(--shadow-lg);
    }

    .card-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      border-radius: 1.25rem 1.25rem 0 0;
      transition: height 0.3s ease;
    }

    .category-card:hover .card-bg {
      height: 100%;
      opacity: 0.04;
      border-radius: 1.25rem;
    }

    .medical-bg { background: var(--medical); }
    .tech-bg { background: var(--tech); }
    .machine-bg { background: var(--machine); }
    .carpentry-bg { background: var(--carpentry); }
    .education-bg { background: var(--education); }

    .card-content {
      position: relative;
      z-index: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
    }

    .icon-wrap::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .category-card[data-category="medical"] .icon-wrap {
      background: var(--medical-soft);
      color: var(--medical);
    }
    .category-card[data-category="medical"] .icon-wrap::after {
      background: var(--medical-glow);
    }

    .category-card[data-category="technology"] .icon-wrap {
      background: var(--tech-soft);
      color: var(--tech);
    }
    .category-card[data-category="technology"] .icon-wrap::after {
      background: var(--tech-glow);
    }

    .category-card[data-category="machine"] .icon-wrap {
      background: var(--machine-soft);
      color: var(--machine);
    }
    .category-card[data-category="machine"] .icon-wrap::after {
      background: var(--machine-glow);
    }

    .category-card[data-category="carpentry"] .icon-wrap {
      background: var(--carpentry-soft);
      color: var(--carpentry);
    }
    .category-card[data-category="carpentry"] .icon-wrap::after {
      background: var(--carpentry-glow);
    }

    .category-card[data-category="education"] .icon-wrap {
      background: var(--education-soft);
      color: var(--education);
    }
    .category-card[data-category="education"] .icon-wrap::after {
      background: var(--education-glow);
    }

    .category-card:hover .icon-wrap::after {
      opacity: 1;
    }

    .category-card:hover .icon-wrap {
      transform: scale(1.08);
    }

    .card-text {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .cat-label {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .cat-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .card-arrow {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: var(--text-muted);
      opacity: 0.4;
      transition: all 0.3s ease;
    }

    .card-shine {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255,255,255,0.4) 50%,
        transparent 100%
      );
      transform: translateX(-100%) rotate(25deg);
      opacity: 0;
      transition: transform 0.7s ease, opacity 0.3s ease;
      pointer-events: none;
    }

    /* Results */
    .results-header {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      margin-top: 0.25rem;
    }

    .back-btn:hover {
      background: var(--bg);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateX(-2px);
    }

    .back-btn:active {
      transform: scale(0.92);
    }

    .results-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .results-title-wrap .section-tag {
      margin-bottom: 0.35rem;
    }

    #results-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .expert-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .expert-card {
      background: var(--surface);
      border-radius: 1.25rem;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1.5px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .expert-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--primary);
      border-radius: 1.25rem 0 0 1.25rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .expert-card:hover {
      border-color: rgba(99,102,241,0.2);
      box-shadow: var(--shadow-lg);
      transform: translateX(4px);
    }

    .expert-card:hover::before {
      opacity: 1;
    }

    .expert-card:active {
      transform: scale(0.98);
    }

    .expert-avatar {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      color: var(--primary-dark);
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(99,102,241,0.15);
    }

    .expert-info {
      flex: 1;
      min-width: 0;
    }

    .expert-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin: 0 0 0.2rem;
      letter-spacing: -0.01em;
    }

    .expert-role {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin: 0 0 0.4rem;
    }

    .expert-meta {
      display: flex;
      gap: 0.875rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .expert-meta span {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
    }

    .expert-arrow {
      color: var(--text-muted);
      flex-shrink: 0;
      opacity: 0.4;
      transition: all 0.2s ease;
    }

    .expert-card:hover .expert-arrow {
      opacity: 1;
      color: var(--primary);
      transform: translateX(3px);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: var(--surface-elevated);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 1.5rem;
      padding: 0;
      width: 100%;
      max-width: 380px;
      text-align: center;
      position: relative;
      box-shadow: var(--shadow-xl), var(--shadow-glow);
      border: 1px solid rgba(255,255,255,0.6);
      animation: modalSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-hero {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      padding: 2rem 1.5rem 1.5rem;
      position: relative;
      border-bottom: 1px solid var(--border);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      z-index: 2;
      backdrop-filter: blur(4px);
    }

    .modal-close:hover {
      background: var(--surface);
      color: var(--text);
      transform: rotate(90deg);
    }

    .modal-avatar {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.6rem;
      color: var(--primary-dark);
      margin: 0 auto 0.75rem;
      box-shadow: 0 4px 20px rgba(99,102,241,0.2);
      border: 3px solid white;
    }

    .modal-status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    .modal-status.online::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(34,197,94,0.2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .modal-card h3 {
      margin: 1.25rem 0 0.25rem;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      padding: 0 1.5rem;
    }

    .modal-role {
      margin: 0 0 1rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 0 1.5rem;
    }

    .modal-meta {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      padding: 0 1.5rem;
    }

    .meta-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      background: var(--bg);
      padding: 0.4rem 0.85rem;
      border-radius: 10px;
      font-weight: 500;
      border: 1px solid var(--border);
    }

    .contact-actions {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      padding: 0 1.5rem 1.5rem;
    }

    .contact-btn {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 0.875rem 1.25rem;
      border-radius: 1rem;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border: none;
      text-align: left;
    }

    .contact-btn:hover {
      transform: translateY(-2px);
    }

    .contact-btn:active {
      transform: scale(0.97);
    }

    .contact-btn.primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }

    .contact-btn.primary:hover {
      box-shadow: 0 6px 20px rgba(99,102,241,0.45);
    }

    .contact-btn.secondary {
      background: var(--bg);
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    .contact-btn.secondary:hover {
      background: #f8fafc;
      border-color: var(--primary-light);
      color: var(--primary-dark);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-btn.primary .btn-icon {
      background: rgba(255,255,255,0.15);
    }

    .contact-btn.secondary .btn-icon {
      background: rgba(99,102,241,0.08);
      color: var(--primary);
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .btn-label {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .btn-sublabel {
      font-size: 0.75rem;
      opacity: 0.7;
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .category-grid {
        grid-template-columns: 1fr;
      }
      .app-header {
        padding: 2rem 1rem 3.5rem;
      }
      .logo h1 {
        font-size: 1.6rem;
      }
      .card-content {
        flex-direction: row;
        align-items: center;
        gap: 1rem;
      }
      .card-text {
        flex: 1;
      }
      .cat-desc {
        max-width: 200px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-glow"></div>
    <div class="logo">
      <div class="logo-icon">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
              <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.8"/>
            </linearGradient>
          </defs>
          <circle cx="16" cy="16" r="13" stroke="url(#logoGrad)" stroke-width="2.5"/>
          <path d="M16 7v16M8 15l8-8 8 8" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="logo-text">
        <h1>HelpPoint</h1>
        <span class="badge">v2.1</span>
      </div>
    </div>
    <p class="subtitle">Find local experts, get help fast</p>
  </header>

  <main id="main-content">
    <!-- STEP 1: Category Selection -->
    <section id="category-step" class="step active">
      <div class="section-header">
        <span class="section-tag">Step 1</span>
        <h2>What expertise do you need?</h2>
      </div>
      <div class="category-grid">
        <button class="category-card" data-category="medical">
          <div class="card-bg medical-bg"></div>
          <div class="card-content">
            <div class="icon-wrap">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            </div>
            <div class="card-text">
              <span class="cat-label">Medical</span>
              <span class="cat-desc">Doctors, nurses, first aid specialists</span>
            </div>
            <div class="card-arrow">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </div>
          </div>
          <div class="card-shine"></div>
        </button>

        <button class="category-card" data-category="technology">

    <section id="results-step" class="step">

    <!-- STEP 3: Contact Modal -->
    <div id="contact-modal" class="modal-overlay">
      <div class="modal-card">
        <button class="modal-close" id="modal-close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="modal-hero">
          <div class="modal-avatar" id="modal-avatar"></div>
          <div class="modal-status online">● Available now</div>
        </div>
        <h3 id="modal-name"></h3>
        <p id="modal-role" class="modal-role"></p>
        <div class="modal-meta">
          <span class="meta-chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span id="modal-distance"></span>
          </span>
          <span class="meta-chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span id="modal-rating"></span>
          </span>
        </div>
        <div class="contact-actions">
          <a id="call-btn" class="contact-btn primary" href="#">
            <div class="btn-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </div>
            <div class="btn-text">
              <span class="btn-label">Call</span>
              <span class="btn-sublabel" id="call-number"></span>
            </div>
          </a>
          <a id="email-btn" class="contact-btn secondary" href="#">
            <div class="btn-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
            <div class="btn-text">
              <span class="btn-label">Email</span>
              <span class="btn-sublabel" id="email-address"></span>
            </div>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function() {
      const experts = {
        medical: [
          { name: "Dr. Sarah Chen", role: "General Practitioner", distance: "0.3 mi", rating: "4.9", phone: "+1-555-0101", email: "s.chen@helppoint.local" },
          { name: "James Okafor", role: "Paramedic / First Aid", distance: "0.7 mi", rating: "4.8", phone: "+1-555-0102", email: "j.okafor@helppoint.local" },
          { name: "Dr. Emily Ross", role: "Pediatric Nurse", distance: "1.2 mi", rating: "4.7", phone: "+1-555-0103", email: "e.ross@helppoint.local" },
          { name: "Dr. Michael Park", role: "Emergency Medicine", distance: "1.5 mi", rating: "5.0", phone: "+1-555-0104", email: "m.park@helppoint.local" },
        ],
        technology: [
          { name: "Aisha Patel", role: "IT Support Specialist", distance: "0.2 mi", rating: "4.8", phone: "+1-555-0201", email: "a.patel@helppoint.local" },
          { name: "Tomás Rivera", role: "Software Engineer", distance: "0.5 mi", rating: "4.9", phone: "+1-555-0202", email: "t.rivera@helppoint.local" },
          { name: "Lena Volkov", role: "Hardware Repair Tech", distance: "0.9 mi", rating: "4.6", phone: "+1-555-0203", email: "l.volkov@helppoint.local" },
          { name: "David Kim", role: "Network Administrator", distance: "1.3 mi", rating: "4.7", phone: "+1-555-0204", email: "d.kim@helppoint.local" },
        ],
        machine: [
          { name: "Marcus Johnson", role: "Auto Mechanic", distance: "0.4 mi", rating: "4.9", phone: "+1-555-0301", email: "m.johnson@helppoint.local" },
          { name: "Elena Petrova", role: "Industrial Engineer", distance: "0.8 mi", rating: "4.7", phone: "+1-555-0302", email: "e.petrova@helppoint.local" },
          { name: "Kenji Tanaka", role: "Appliance Repair", distance: "1.1 mi", rating: "4.8", phone: "+1-555-0303", email: "k.tanaka@helppoint.local" },
          { name: "Rosa Martinez", role: "Heavy Machinery Tech", distance: "1.6 mi", rating: "4.6", phone: "+1-555-0304", email: "r.martinez@helppoint.local" },
        ],
        carpentry: [
          { name: "Oliver Brown", role: "Master Carpenter", distance: "0.3 mi", rating: "5.0", phone: "+1-555-0401", email: "o.brown@helppoint.local" },
          { name: "Sofia Andersson", role: "Furniture Maker", distance: "0.6 mi", rating: "4.8", phone: "+1-555-0402", email: "s.andersson@helppoint.local" },
          { name: "Jamal Wright", role: "Finish Carpenter", distance: "1.0 mi", rating: "4.7", phone: "+1-555-0403", email: "j.wright@helppoint.local" },
          { name: "Nadia Hassan", role: "Cabinet Specialist", distance: "1.4 mi", rating: "4.9", phone: "+1-555-0404", email: "n.hassan@helppoint.local" },
        ],
        education: [
          { name: "Prof. Anna Schmidt", role: "Math & Science Tutor", distance: "0.2 mi", rating: "5.0", phone: "+1-555-0501", email: "a.schmidt@helppoint.local" },
          { name: "Carlos Mendez", role: "Language Coach — Spanish", distance: "0.5 mi", rating: "4.9", phone: "+1-555-0502", email: "c.mendez@helppoint.local" },
          { name: "Priya Sharma", role: "Test Prep Specialist", distance: "0.8 mi", rating: "4.8", phone: "+1-555-0503", email: "p.sharma@helppoint.local" },
          { name: "Dr. Robert Lin", role: "Music Teacher — Piano", distance: "1.1 mi", rating: "4.9", phone: "+1-555-0504", email: "r.lin@helppoint.local" },
          { name: "Yuki Nakamura", role: "Coding Instructor — Python", distance: "1.3 mi", rating: "4.7", phone: "+1-555-0505", email: "y.nakamura@helppoint.local" },
        ]
      };

      const categoryStep = document.getElementById('category-step');
      const resultsStep = document.getElementById('results-step');
      const expertList = document.getElementById('expert-list');
      const resultsTitle = document.getElementById('results-title');
      const backBtn = document.getElementById('back-btn');
      const modal = document.getElementById('contact-modal');
      const modalClose = document.getElementById('modal-close');

      function initials(name) {
        return name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
      }

      function showExperts(category) {
        const list = experts[category] || [];
        resultsTitle.textContent = category.charAt(0).toUpperCase() + category.slice(1) + ' Experts';
        expertList.innerHTML = '';

        list.forEach((expert, index) => {
          const card = document.createElement('div');
          card.className = 'expert-card';
          card.style.animationDelay = (index * 0.06) + 's';
          card.innerHTML = `
            <div class="expert-avatar">${initials(expert.name)}</div>
            <div class="expert-info">
              <p class="expert-name">${expert.name}</p>
              <p class="expert-role">${expert.role}</p>
              <div class="expert-meta">
                <span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                  ${expert.distance}
                </span>
                <span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                  ${expert.rating}
                </span>
              </div>
            </div>
            <div class="expert-arrow">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </div>
          `;
          card.addEventListener('click', () => openModal(expert));
          expertList.appendChild(card);
        });

        categoryStep.classList.remove('active');
        resultsStep.classList.add('active');
      }

      function openModal(expert) {
        document.getElementById('modal-avatar').textContent = initials(expert.name);
        document.getElementById('modal-name').textContent = expert.name;
        document.getElementById('modal-role').textContent = expert.role;
        document.getElementById('modal-distance').textContent = expert.distance + ' away';
        document.getElementById('modal-rating').textContent = expert.rating + ' rating';
        document.getElementById('call-btn').href = 'tel:' + expert.phone;
        document.getElementById('email-btn').href = 'mailto:' + expert.email;
        document.getElementById('call-number').textContent = expert.phone;
        document.getElementById('email-address').textContent = expert.email;
        modal.classList.add('open');
      }

      function closeModal() {
        modal.classList.remove('open');
      }

      document.querySelectorAll('.category-card').forEach(card => {
        card.addEventListener('click', () => showExperts(card.dataset.category));
      });

      backBtn.addEventListener('click', () => {
        resultsStep.classList.remove('active');
        categoryStep.classList.add('active');
      });

      modalClose.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) {
          closeModal();
        }
      });
    })();
  </script>
</body>
</html>
